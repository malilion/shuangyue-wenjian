<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霜月問劍</title>
<style>
  :root { --kai: "Kaiti TC", "STKaiti", "BiauKai", "DFKai-SB", "Songti TC", "Noto Serif TC", serif; --ink: #e8eef0; --teal: #7fe3e6; --red: #d8483e; --gold: #e2c88a; }
  html, body { margin: 0; height: 100%; background: #05080c; overflow: hidden; color: var(--ink); font-family: var(--kai); user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  body.play #hud { opacity: 1; }

  .bar { position: relative; transform: skewX(-22deg); background: rgba(6, 10, 14, .72); border: 1px solid rgba(225, 235, 240, .32); overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
  .bar > i.lag { background: #e9dcae; transition: width .45s ease-out .28s; }
  .bar > i.fill { transition: width .08s linear; }
  .bar > i.fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: rgba(255, 255, 255, .85); }
  .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 39px, rgba(0, 0, 0, .45) 39px 40px); }

  #pl { position: absolute; left: 34px; top: 28px; width: 340px; }
  #pl .name { font-size: 15px; letter-spacing: .5em; opacity: .85; margin: 0 0 7px 6px; }
  #hp { height: 13px; } #hp .fill { background: linear-gradient(180deg, #e8685a, #a8281f); }
  #st { height: 5px; width: 72%; margin-top: 5px; } #st .fill { background: linear-gradient(180deg, #f1e3a7, #b9993f); }
  #qi { height: 5px; width: 58%; margin-top: 4px; } #qi .fill { background: linear-gradient(180deg, #9ff2f2, #2f9aa3); }

  #boss { position: absolute; left: 50%; top: 30px; width: min(620px, 60vw); transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .8s; }
  #boss.on { opacity: 1; }
  #boss .name { font-size: 20px; letter-spacing: .7em; margin: 0 0 8px .7em; text-shadow: 0 0 12px #000; }
  #boss .name small { font-size: 12px; letter-spacing: .5em; opacity: .65; margin-left: .6em; }
  #bhp { height: 11px; } #bhp .fill { background: linear-gradient(180deg, #c9413a, #6f1418); }
  #bpo { height: 3px; width: 46%; margin: 5px auto 0; } #bpo .fill { background: #e2c88a; } #bpo::after { display: none; }

  #skills { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 8px; }
  .slot { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(225, 235, 240, .45); background: radial-gradient(circle at 50% 35%, rgba(60, 90, 100, .55), rgba(6, 10, 14, .85)); overflow: hidden; box-shadow: 0 0 14px rgba(0, 0, 0, .6); }
  .slot b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 25px; font-weight: 400; color: #dff6f6; text-shadow: 0 0 10px rgba(127, 227, 230, .7); }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0, 0, 0, .72); }
  .slot.active { box-shadow: 0 0 18px rgba(127, 227, 230, .9); border-color: #bff; }
  .slot.dim b { color: #6b777b; text-shadow: none; } .slot.dim img { filter: grayscale(1) brightness(.45); }
  .slotw { position: relative; width: 62px; height: 80px; display: grid; justify-items: center; }
  .slotw.ult { width: 78px; margin-left: 10px; } .slotw.ult .slot { width: 66px; height: 66px; margin-top: -4px; } .slotw.ult .slot b { color: #f3e2ad; text-shadow: 0 0 10px rgba(226, 200, 138, .8); }
  .charge { position: absolute; left: 50%; top: -9px; width: 76px; height: 76px; margin-left: -38px; border-radius: 50%; background: conic-gradient(#e9d49a var(--p, 0%), rgba(255, 255, 255, .1) 0); -webkit-mask: radial-gradient(circle, transparent 34px, #000 35px); mask: radial-gradient(circle, transparent 34px, #000 35px); }
  .slotw.ult.ready .charge { background: conic-gradient(#fff3c4 100%, transparent 0); animation: ultpulse 1s ease-in-out infinite; } .slotw.ult.ready .slot { box-shadow: 0 0 22px rgba(240, 215, 140, .75); }
  .slotw.ult:not(.ready) .slot img { filter: grayscale(.85) brightness(.55); } .slotw.ult:not(.ready) .slot b { color: #7d7868; text-shadow: none; }
  @keyframes ultpulse { 50% { filter: brightness(1.6) drop-shadow(0 0 8px #f6dc92); } }
  .slotw em { position: absolute; bottom: -4px; font: 11px/1 ui-monospace, Menlo, monospace; font-style: normal; letter-spacing: .08em; opacity: .7; }

  #counter { position: absolute; left: 50%; bottom: 138px; transform: translateX(-50%); font-size: 17px; letter-spacing: .5em; color: var(--gold); text-shadow: 0 0 14px rgba(226, 200, 138, .9); opacity: 0; transition: opacity .1s; }
  #counter.on { opacity: 1; }
  #banner { position: absolute; left: 0; right: 0; top: 23%; text-align: center; opacity: 0; transition: opacity 1s; text-shadow: 0 2px 18px #000, 0 0 3px #000; }
  #banner.on { opacity: 1; }
  #banner h2 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: .6em; text-indent: .6em; }
  #banner p { margin: 12px 0 0; font-size: 16px; letter-spacing: .32em; opacity: .82; }
  #hurt { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 180px 40px rgba(190, 20, 20, .85); opacity: 0; }

  .screen { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 45%, rgba(5, 8, 12, .15), rgba(5, 8, 12, .82)); cursor: pointer; }
  .screen.on { display: grid; }
  .screen h1 { margin: 0; font-size: clamp(60px, 10vw, 128px); font-weight: 400; letter-spacing: .28em; text-indent: .28em; text-shadow: 0 0 40px rgba(127, 227, 230, .35), 0 4px 30px #000; }
  .screen h1.small { font-size: 64px; }
  .screen h1 img { display: none; width: min(880px, 78vw); filter: drop-shadow(0 0 26px rgba(127, 227, 230, .35)) drop-shadow(0 6px 22px #000); }
  .screen h1.img { letter-spacing: 0; text-indent: 0; font-size: 0; line-height: 0; } .screen h1.img span { display: none; } .screen h1.img img { display: inline-block; }
  .screen .sub { font-size: 17px; letter-spacing: .6em; text-indent: .6em; opacity: .75; margin-top: 10px; }
  .screen .go { margin-top: 54px; font-size: 19px; letter-spacing: .55em; text-indent: .55em; color: var(--teal); animation: breathe 2.2s ease-in-out infinite; }
  .screen .keys { margin-top: 38px; font-size: 14px; letter-spacing: .2em; line-height: 2; opacity: .72; }
  .screen .keys kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid rgba(225, 235, 240, .45); padding: 2px 7px; margin: 0 4px 0 14px; letter-spacing: 0; }
  @keyframes breathe { 50% { opacity: .35; } }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="pl">
    <div class="name">沈霜</div>
    <div class="bar" id="hp"><i class="lag"></i><i class="fill"></i></div>
    <div class="bar" id="st"><i class="fill"></i></div>
    <div class="bar" id="qi"><i class="fill"></i></div>
  </div>
  <div id="boss">
    <div class="name">厲無咎<small>墮劍尊</small></div>
    <div class="bar" id="bhp"><i class="lag"></i><i class="fill"></i></div>
    <div class="bar" id="bpo"><i class="fill"></i></div>
  </div>
  <div id="banner"><h2></h2><p></p></div>
  <div id="counter">破綻 · 左鍵</div>
  <div id="skills">
    <div class="slotw"><div class="slot" id="s-atk"><b>斬</b><img src="assets/ui/icon_atk.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>左鍵</em></div>
    <div class="slotw"><div class="slot" id="s-blk"><b>架</b><img src="assets/ui/icon_blk.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>右鍵</em></div>
    <div class="slotw"><div class="slot" id="s-dge"><b>閃</b><img src="assets/ui/icon_dge.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>空白</em></div>
    <div class="slotw"><div class="slot" id="s-q"><b>氣</b><img src="assets/ui/icon_q.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>Q</em></div>
    <div class="slotw"><div class="slot" id="s-e"><b>落</b><img src="assets/ui/icon_e.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>E</em></div>
    <div class="slotw"><div class="slot" id="s-f"><b>御</b><img src="assets/ui/icon_f.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>F</em></div>
    <div class="slotw"><div class="slot" id="s-c"><b>陣</b><img src="assets/ui/icon_c.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>C</em></div>
    <div class="slotw"><div class="slot" id="s-fly"><b>飛</b><img src="assets/ui/icon_fly.png" alt="" onerror="this.remove()"><div class="cd"></div></div><em>Shift</em></div>
    <div class="slotw ult"><div class="charge" id="s-r-ring"></div><div class="slot" id="s-r"><b>絕</b><img src="assets/ui/icon_r.png" alt="" onerror="this.remove()"></div><em>R</em></div>
  </div>
</div>
<div id="hurt"></div>

<div class="screen on" id="title">
  <div>
    <h1><span>霜月問劍</span><img src="assets/ui/title.png" alt="霜月問劍" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></h1>
    <div class="sub">廢棄山門 · 演武台</div>
    <div class="go" id="go">載入中</div>
    <div class="keys">
      <kbd>W A S D</kbd>移動<kbd>左鍵</kbd>三段斬<kbd>右鍵</kbd>格擋，剛舉劍時接住即彈反<br>
      <kbd>空白</kbd>閃避<kbd>Q</kbd>劍氣<kbd>E</kbd>落劍<kbd>F</kbd>御劍追魂<kbd>C</kbd>劍陣環身<br>
      <kbd>Shift</kbd>按住御劍飛行，飛行中左鍵俯衝突刺<kbd>R</kbd>劍意滿時放大招<kbd>F3</kbd>除錯面板
    </div>
  </div>
</div>
<div class="screen" id="dead"><div><h1 class="small">劍折</h1><div class="go">點擊重來</div></div></div>
<div class="screen" id="win"><div><h1 class="small">山門已靜</h1><div class="sub">厲無咎的劍插在台心，沒有再響</div><div class="go">點擊再戰</div></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
